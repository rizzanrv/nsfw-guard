name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: syntax check
        run: python -m compileall -q nsfw_guard tools tests

      - name: unit tests (real inference, no network)
        run: python -m unittest discover -s tests -v

      - name: cli smoke
        run: |
          python -m nsfw_guard --cli --list-monitors
          python -c "import nsfw_guard; print('version', nsfw_guard.VERSION)"

      - name: build the package
        run: python -m pip install --upgrade build && python -m build
